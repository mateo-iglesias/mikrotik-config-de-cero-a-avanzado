# Configuracion del cliente WireGuard (Linux, Windows, Android, iOS)
# Linux: guardar como /etc/wireguard/wg-lab.conf con permisos 600
# Windows / celular: importar en la app oficial de WireGuard

[Interface]
# Clave privada del CLIENTE (nunca se comparte ni se sube a GitHub)
PrivateKey = CAMBIAR_AQUI
# IP del cliente dentro del tunel (una distinta por dispositivo)
Address = 10.99.0.2/32

[Peer]
# Clave publica del ROUTER (/interface wireguard print)
PublicKey = CAMBIAR_AQUI
# IP publica (o nombre DDNS) del router y puerto de WireGuard
Endpoint = CAMBIAR_AQUI:13231
# Split tunnel: solo el trafico hacia el router va por la VPN
AllowedIPs = 10.99.0.1/32
