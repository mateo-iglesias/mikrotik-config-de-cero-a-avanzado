# Servidor syslog para el MikroTik (Ubuntu con rsyslog)
# Copiar a: /etc/rsyslog.d/10-mikrotik.conf
# Antes:  sudo mkdir -p /var/log/mikrotik && sudo chown syslog:adm /var/log/mikrotik
# Despues: sudo rsyslogd -N1 && sudo systemctl restart rsyslog
#
# Escucha UDP 514 y guarda en un archivo aparte SOLO lo que llega del router.
# Todo lo demas que llegue por este puerto se descarta.

module(load="imudp")
input(type="imudp" port="514" ruleset="mikrotik")

ruleset(name="mikrotik") {
    # IP del router en la VLAN admin (src-address del modulo 06)
    if ($fromhost-ip == "192.168.10.1") then {
        action(type="omfile" file="/var/log/mikrotik/hAP-lite-LAB.log"
               fileOwner="syslog" fileGroup="adm" fileCreateMode="0640")
    }
    stop
}
